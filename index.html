function startBattle(){
  if(!currentBattle) return;
  const allUnits = [...currentBattle.myTeam, ...currentBattle.enemyTeam];
  let tick = 0;
  let ended = false;
  const logEl = document.getElementById('battleLog');
  logEl.innerHTML = '';
  let logLines = [];   // { text, cls }
  const appendLog = (text, cls) => {
    logLines.push({ text, cls });
    if(logLines.length > 100) logLines.shift();
    // 用 innerHTML 一次性替换，比 appendChild 快很多
    logEl.innerHTML = logLines.map(l =>
      l.cls ? `<div style="color:${l.cls}">${l.text.replace(/</g, '&lt;')}</div>` : `<div>${l.text.replace(/</g, '&lt;')}</div>`
    ).join('');
    logEl.scrollTop = logEl.scrollHeight;
  };
  document.getElementById('battlePrep').style.display = 'none';
  document.getElementById('battleFighting').style.display = 'block';
  document.getElementById('battleResult').style.display = 'none';
  document.getElementById('battleBackRow').style.display = 'none';

  // 重置视觉
  battleVisuals.popups = [];

  appendLog(`⚔️ 战斗开始！我方 ${currentBattle.myTeam.length} 人 vs 敌方 ${currentBattle.enemyTeam.length} 人`, 'var(--gold)');

  function updateStatus(){
    const pAlive = allUnits.filter(u => u.isPlayer && u.alive).length;
    const eAlive = allUnits.filter(u => !u.isPlayer && u.alive).length;
    document.getElementById('statusMy').textContent = pAlive;
    document.getElementById('statusMyTotal').textContent = currentBattle.myTeam.length;
    document.getElementById('statusTick').textContent = tick;
    document.getElementById('statusEnemy').textContent = eAlive;
    document.getElementById('statusEnemyTotal').textContent = currentBattle.enemyTeam.length;
  }
  updateStatus();
  // 清空战场 DOM，创建初始单位
  clearBattleDOM();
  currentBattle.ended = false;
  renderBattleDOM();

  let lastFrameTime = performance.now();
  let accumulator = 0;
  const tickMs = BATTLE_CONFIG.TICK_MS;

  function battleLoop(now){
    if(currentBattle.ended) return;
    const dt = now - lastFrameTime;
    lastFrameTime = now;
    accumulator += dt;

    // 最多补 2 次 tick，防止切后台回来瞬间跑几十次
    let safety = 0;
    while(accumulator >= tickMs && safety < 2){
      accumulator -= tickMs;
      safety++;
      tick++;

      // 处理所有 DoT 效果
      allUnits.forEach(u => {
        if(!u.alive || !u.dotEffects || u.dotEffects.length === 0) return;
        u.dotEffects = u.dotEffects.filter(dot => {
          if(dot.remaining <= 0) return false;
          u.hp -= dot.damage;
          pushPopup(u, '-' + dot.damage, '#a371f7');
          dot.remaining--;
          if(u.hp <= 0){
            if(tryAncientDragonRevive(u, appendLog)){
              return dot.remaining > 0;
            }
            if(tryVoidOverlordRevive(u, appendLog)){
              return dot.remaining > 0;
            }
            if(u.enemyType === 'abyss_apostle' && !u.hasRevived){
              u.hasRevived = true;
              u.hp = Math.floor(u.maxHp * 0.6);
              return dot.remaining > 0;
            }
            if(u.enemyType === 'bone_warrior' && !u.hasRevived){
              u.hasRevived = true;
              u.hp = Math.floor(u.maxHp);
              const el = document.getElementById('unit-' + u.id);
              if(el){
                const c = el.querySelector('.battle-unit-circle');
                if(c){
                  c.classList.remove('revive-burst');
                  void c.offsetWidth;
                  c.classList.add('revive-burst');
                  setTimeout(() => c.classList.remove('revive-burst'), 950);
                }
              }
              const layer = document.getElementById('battlePopups');
              if(layer){
                const CELL = 40;
                const txt = document.createElement('div');
                txt.className = 'revive-text';
                txt.textContent = '✨ 还 魂 ✨';
                txt.style.left = (u.x * CELL + CELL/2) + 'px';
                txt.style.top = (u.y * CELL + CELL/2 - 10) + 'px';
                layer.appendChild(txt);
                setTimeout(() => { if(txt.isConnected) txt.remove(); }, 1300);
              }
              playSound('drop');
            } else {
              u.hp = 0;
              u.alive = false;
            }
          }
          return dot.remaining > 0;
        });
      });

      for(const unit of allUnits.filter(u => u.alive).sort((a, b) => b.spd - a.spd)){
        if(!unit.alive) continue;
        if(unit.moveCd <= 0){ moveAI(unit, allUnits); unit.moveCd = unit.moveCdMax; }
        if(unit.atkCd <= 0){ attackAI(unit, allUnits, (t) => appendLog(t)); unit.atkCd = unit.atkCdMax; }
        skillAI(unit, allUnits, (t) => appendLog(t));
        resourceTick(unit);
        unit.moveCd--;
        unit.atkCd--;
      }

      renderBattleDOM();
      updateStatus();

      const pAlive = allUnits.filter(u => u.isPlayer && u.alive).length;
      const eAlive = allUnits.filter(u => !u.isPlayer && u.alive).length;
      if(pAlive === 0 || eAlive === 0 || tick >= BATTLE_CONFIG.MAX_TICKS){
        currentBattle.ended = true;
        renderBattleDOM();
        finishBattle(allUnits, tick);
        return;
      }
    }
    currentBattle.renderFrame = requestAnimationFrame(battleLoop);
  }
  currentBattle.renderFrame = requestAnimationFrame(battleLoop);}
// ==================== DOM 战场渲染 ====================
function renderBattleDOM(){
  const layer = document.getElementById('battleUnits');
  if(!layer || !currentBattle) return;
  const N = BATTLE_CONFIG.GRID;
  const CELL = 520 / N;
  const allUnits = [...currentBattle.myTeam, ...currentBattle.enemyTeam];

  allUnits.forEach(u => {
    let el = document.getElementById('unit-' + u.id);

    if(!u.alive){
      if(el && !el._dying){
        el._dying = true;
        // 阶段 1：闪白放大
        el.style.transition = 'transform 0.25s ease-out, filter 0.25s ease-out';
        el.style.filter = 'brightness(3) saturate(0)';
        el.style.transform = `translate(${u.x * CELL}px, ${u.y * CELL}px) scale(1.4)`;
        // 阶段 2：缩小旋转淡出
        setTimeout(() => {
          if(!el.isConnected) return;
          el.style.transition = 'transform 1.2s ease-in, opacity 1.2s ease-in, filter 1.2s ease-in';
          el.style.transform = `translate(${u.x * CELL}px, ${u.y * CELL}px) scale(0.2) rotate(60deg)`;
          el.style.opacity = '0';
          el.style.filter = 'grayscale(1) brightness(0.2)';
          setTimeout(() => { if(el.isConnected) el.remove(); }, 1250);
        }, 250);
      }
      return;
    }

    if(!el){
      el = document.createElement('div');
      el.className = 'battle-unit';
      el.id = 'unit-' + u.id;
            const circleBg = u.enemyColor || (u.isTrueBoss ? '#e3b341' : JOB_COLORS[u.job]);
      const circleIcon = u.enemyIcon || (u.isTrueBoss ? '主' : JOB_ICONS[u.job]);
      const circleBorder = u.isTrueBoss ? '#f85149' : (u.isPlayer ? '#58a6ff' : '#f85149');
      const nameText = u.name.length > 6 ? u.name.substring(0, 6) : u.name;
      el.innerHTML = `
        <div class="battle-hpbar"><div class="battle-hpbar-inner"></div></div>
        <div class="battle-unit-circle" style="background:${circleBg};border-color:${circleBorder};font-weight:900;${u.isTrueBoss ? 'box-shadow:0 0 12px #e3b341;width:36px;height:36px;font-size:18px;' : ''}">${circleIcon}</div>
        <div class="battle-name">${nameText}</div>
      `;
      el._cache = { x:-1, y:-1, hp:-1, shield:-1, defBuff:-1 };
      layer.appendChild(el);
    }

    const c = el._cache;

    // 只在位置真正变化时更新
    if(c.x !== u.x || c.y !== u.y){
      el.style.transform = `translate(${u.x * CELL}px, ${u.y * CELL}px)`;
      c.x = u.x; c.y = u.y;
    }

    // 只在血量变化时更新（友方绿，敌方红）
    if(c.hp !== u.hp){
      const hpEl = el.querySelector('.battle-hpbar-inner');
      const hpPct = Math.max(0, u.hp / u.maxHp);
      hpEl.style.width = (hpPct * 100) + '%';
      hpEl.style.background = u.isPlayer ? '#3fb950' : '#f85149';
      c.hp = u.hp;
    }

    // 只在护盾/防御变化时更新
    if(c.shield !== u.shield || c.defBuff !== u.defBuff){
      const circle = el.querySelector('.battle-unit-circle');
      if(u.shield > 0){
        circle.style.boxShadow = '0 0 0 3px #79c0ff';
      } else if(u.defBuff > 0){
        circle.style.boxShadow = '0 0 0 4px rgba(227,179,65,0.5)';
      } else {
        circle.style.boxShadow = '';
      }
      c.shield = u.shield; c.defBuff = u.defBuff;
    }
  });
}
function clearBattleDOM(){
  const unitLayer = document.getElementById('battleUnits');
  const popupLayer = document.getElementById('battlePopups');
  if(unitLayer) unitLayer.innerHTML = '';
  if(popupLayer) popupLayer.innerHTML = '';
}
function finishBattle(allUnits, tick){
  if(currentBattle){
    currentBattle.ended = true;
    if(currentBattle.renderFrame){
      cancelAnimationFrame(currentBattle.renderFrame);
      currentBattle.renderFrame = null;
    }
    if(currentBattle.intervalHandle){
      clearInterval(currentBattle.intervalHandle);
      currentBattle.intervalHandle = null;
    }
  }
  const myAlive = allUnits.filter(u => u.isPlayer && u.alive);
  const enemyAlive = allUnits.filter(u => !u.isPlayer && u.alive);
  const won = enemyAlive.length === 0 && myAlive.length > 0;
  const draw = tick >= BATTLE_CONFIG.MAX_TICKS && enemyAlive.length > 0 && myAlive.length > 0;

  // 计算奖励（层数加成）
  const enemyTeam = currentBattle.enemyOrigin;
  const totalLv = enemyTeam.reduce((s, m) => s + m.level, 0);
  const floor = currentBattle.floor || 1;
  const floorMult = 1 + (floor - 1) * 0.15;
  const goldReward = won ? Math.floor((enemyTeam.length * 50 + totalLv * 20) * floorMult) : 0;
  const expReward = won ? Math.floor(totalLv * 36 * floorMult) : 0;

  // 推进层数
  let floorCleared = false;
  let dungeonCompleted = false;
  if(won && floor === state.dungeonFloor){
    floorCleared = true;
    if(floor > state.maxClearedFloor) state.maxClearedFloor = floor;
    if(floor < 50){
      state.dungeonFloor = floor + 1;
    } else {
      dungeonCompleted = true;
    }
    // ★ 通关一层，商店下次刷新免费
    state.shopRefreshCost = 0;
  }

  // 计算掉落（每件装备独立 40% 掉率）
  const drops = [];
  if(won && currentBattle.enemyTeam){
    currentBattle.enemyTeam.forEach((battleUnit, idx) => {
      if(battleUnit.alive) return;
      const merc = currentBattle.enemyOrigin[idx];
      if(!merc || !merc.equipment) return;
      ['weapon','armor','trinket'].forEach(slot => {
        const eq = merc.equipment[slot];
        if(eq && Math.random() < 0.4){
          drops.push(eq);
        }
      });
    });
    state.inventory = state.inventory || [];
    drops.forEach(eq => state.inventory.push(eq));
    if(drops.length > 0) playSound('drop');
  }

  // 应用奖励
  let levelUps = [];
  if(won){
    state.gold += goldReward;
    // 经验平分给存活的我方单位（映射回原始佣兵）
    const share = Math.floor(expReward / Math.max(1, myAlive.length));
    myAlive.forEach(bu => {
      const merc = state.team.find(m => m.name === bu.name && m.job === bu.job);
      if(!merc) return;
      // 满级后不再加经验
      if(merc.level >= CONFIG.MAX_LEVEL) return;
      // 天赋经验加成
      const tb = getTalentBonus(merc);
      const personalShare = Math.floor(share * (1 + (tb.expBonus || 0) / 100));
      merc.exp += personalShare;
      // 升级循环
      while(merc.exp >= merc.expNext && merc.level < CONFIG.MAX_LEVEL){
        merc.exp -= merc.expNext;
        merc.level++;
        const data = JOB_DATA[merc.job];
        const lvIdx = merc.level - 1;
        merc.maxHp = data.hpBase + data.hpGrow * lvIdx;
        merc.atk = data.atkBase + data.atkGrow * lvIdx;
        merc.def = data.defBase + data.defGrow * lvIdx;
        merc.spd = Math.floor(data.spdBase + data.spdGrow * lvIdx);
        merc.range = data.rangeBase;
        merc.expNext = getUpgradeExp(merc.level);
        levelUps.push(`${merc.name} → Lv.${merc.level}`);
        playSound('levelup');
      }
      // 回满血
      merc.hp = merc.maxHp;
    });
    state.stats.wins++;
  } else {
    // 失败：不扣金币，回满血
    state.team.forEach(m => { m.hp = m.maxHp; });
    state.stats.losses++;
  }
  state.stats.battles++;
  saveGame();

  // 显示结算
  const box = document.getElementById('battleResultContent');
  let html = '';
  if(won){
    html += `<div style="font-size:1.4rem;color:var(--success);text-align:center;margin:10px 0;">🎉 胜利！</div>`;
        if(dungeonCompleted){
      if(floor === 10){
        html += `<div style="font-size:1.1rem;color:var(--purple);text-align:center;margin:4px 0 10px 0;text-shadow:0 0 10px #a371f7;">👑 恭喜！击败地牢守卫者！第一区通关！</div>`;
      } else if(floor === 20){
        html += `<div style="font-size:1.1rem;color:var(--gold);text-align:center;margin:4px 0 10px 0;text-shadow:0 0 10px #e3b341;">💀 恭喜！击败尸骨之王！第二区通关！</div>`;
      } else if(floor === 30){
        html += `<div style="font-size:1.1rem;color:#6bff8f;text-align:center;margin:4px 0 10px 0;text-shadow:0 0 10px #4ea85e;">🧪 恭喜！击败毒沼巨魔！第三区通关！</div>`;
      } else if(floor === 40){
        html += `<div style="font-size:1.1rem;color:#ff9933;text-align:center;margin:4px 0 10px 0;text-shadow:0 0 10px #ff9933;">🐲 恭喜！击败古代巨龙！第四区通关！</div>`;
      } else if(floor === 50){
        html += `<div style="font-size:1.2rem;color:#b28aff;text-align:center;margin:4px 0 10px 0;text-shadow:0 0 14px #8b1aff;">💀👑 恭喜！击败深渊魔王！你已通关整个地牢 50 层！</div>`;
      }
    } else if(floorCleared){
      html += `<div style="font-size:0.9rem;color:var(--gold);text-align:center;margin:4px 0 10px 0;">🏆 第 ${floor} 层通关 → 前往第 ${state.dungeonFloor} 层</div>`;
    }
    html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;font-size:0.85rem;line-height:1.8;">`;
    html += `<div>获得金币：<span style="color:var(--gold);font-family:var(--font-mono);">+${goldReward}</span></div>`;
    html += `<div>获得经验：<span style="color:var(--accent);font-family:var(--font-mono);">+${expReward}</span>（${myAlive.length} 人平分，每人 +${Math.floor(expReward / myAlive.length)}）</div>`;
    html += `<div>战斗刻数：${tick}</div>`;
    if(levelUps.length > 0){
      html += `<div style="color:var(--gold);margin-top:6px;">⬆️ 升级：${levelUps.join('、')}</div>`;
    }
    if(drops.length > 0){
      const dropNames = drops.map(d => {
        const c = RARITY_COLORS[d.rarity] || '#8b949e';
        return `<span style="color:${c};">${d.name}</span>`;
      }).join('、');
      html += `<div style="margin-top:6px;">🎁 掉落：${dropNames}</div>`;
    }
    html += `</div>`;
  } else if(draw){
    html += `<div style="font-size:1.4rem;color:var(--gold);text-align:center;margin:10px 0;">⚖️ 平局（超时）</div>`;
    html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;font-size:0.85rem;line-height:1.8;">`;
    html += `<div>我方存活：${myAlive.length} / ${currentBattle.myTeam.length}</div>`;
    html += `<div>敌方存活：${enemyAlive.length} / ${currentBattle.enemyTeam.length}</div>`;
    html += `<div style="color:var(--text-dim);margin-top:6px;">双方互交白卷，没有奖励。</div>`;
    html += `</div>`;
  } else {
    html += `<div style="font-size:1.4rem;color:var(--danger);text-align:center;margin:10px 0;">💀 失败</div>`;
    html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;font-size:0.85rem;line-height:1.8;">`;
    html += `<div>没有获得奖励。</div>`;
    html += `<div style="color:var(--text-dim);">全员回满生命，队伍可继续战斗。</div>`;
    html += `</div>`;
  }
  html += `<button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="exitBattleToTown()">🏰 返回城镇</button>`;
  box.innerHTML = html;

  document.getElementById('battleFighting').style.display = 'none';
  document.getElementById('battleResult').style.display = 'block';
  document.getElementById('battleBackRow').style.display = 'flex';
  updateGoldDisplay();

  document.getElementById('battleBackRow').style.display = 'flex';

  const resultMsg = won ? `战斗胜利！+${goldReward} 金币` : (draw ? '战斗平局' : '战斗失败');
  log(resultMsg, won ? 'log-success' : (draw ? 'log-gold' : 'log-fail'));
  if(won){ playSound('win'); playSound('gold'); }
  else if(!draw){ playSound('lose'); }
}

function recruitMercenary(idx){
  if(idx < 0 || idx >= state.recruitPool.length) return;
  const merc = state.recruitPool[idx];
  if(state.gold < merc.price){
    log('金币不足！', 'log-fail');
    return;
  }
  if(state.team.length >= CONFIG.TEAM_LIMIT){
    log(`队伍已满（上限 ${CONFIG.TEAM_LIMIT} 人）`, 'log-fail');
    return;
  }
  state.gold -= merc.price;
  state.team.push(merc);
  state.recruitPool.splice(idx, 1);
  log(`招募成功：${merc.name}（${JOB_DATA[merc.job].name} Lv.${merc.level}）`, 'log-success');
  playSound('recruit');
  saveGame();
  renderRecruit();
  updateGoldDisplay();
}

// ==================== 装备管理弹窗 ====================
function openEquipModal(merc, onClose){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;justify-content:center;align-items:center;z-index:1000;';

  const panel = document.createElement('div');
  panel.style.cssText = 'background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;width:640px;max-width:94vw;max-height:88vh;overflow-y:auto;';

  function refresh(){
    if(!merc.equipment) merc.equipment = { weapon:null, armor:null, trinket:null };
    const slots = ['weapon','armor','trinket'];
    let slotHtml = slots.map(slot => {
      const eq = merc.equipment[slot];
      const color = eq ? RARITY_COLORS[eq.rarity] : 'var(--text-dim)';
      const name = eq ? eq.name : '（空）';
      const statText = eq ? formatEquipStats(eq) : '';
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;">
          <span style="font-size:0.8rem;color:var(--text-dim);width:100px;">${EQUIP_SLOT_NAMES[slot]}</span>
          <span style="flex:1;color:${color};font-weight:600;font-size:0.9rem;">${name}</span>
          <span style="font-size:0.7rem;color:var(--text-dim);">${statText}</span>
          ${eq ? `<button class="btn-tiny unequip-btn" data-slot="${slot}" style="padding:4px 10px;background:var(--panel);border:1px solid var(--border);border-radius:4px;color:var(--text);cursor:pointer;font-size:0.75rem;">卸下</button>` : ''}
        </div>
      `;
    }).join('');

    const inv = state.inventory || [];
    const invByType = { weapon: [], armor: [], trinket: [] };
    inv.forEach((eq, idx) => {
      if(invByType[eq.type]) invByType[eq.type].push({ eq, idx });
    });

    let invHtml = slots.map(slot => {
      const list = invByType[slot];
      if(list.length === 0) return '';
      return `
        <div style="margin-bottom:10px;">
          <div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:4px;">${EQUIP_SLOT_NAMES[slot]}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;">
            ${list.map(({eq, idx}) => `
              <button class="inv-eq-btn" data-idx="${idx}" style="background:var(--card);border:1px solid ${RARITY_COLORS[eq.rarity]};border-radius:4px;padding:6px 10px;color:${RARITY_COLORS[eq.rarity]};cursor:pointer;font-size:0.78rem;font-family:inherit;">
                ${eq.name} <span style="color:var(--text-dim);font-size:0.7rem;">${formatEquipStats(eq)}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }).join('');

    if(!invHtml) invHtml = '<div style="color:var(--text-dim);font-size:0.8rem;text-align:center;padding:20px;">背包里没有装备</div>';

    panel.innerHTML = `
      <div style="font-size:1.1rem;font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;">
        <span>${merc.name} · 装备</span>
        <span style="cursor:pointer;color:var(--text-dim);font-size:1.3rem;" id="closeEquipBtn">✕</span>
      </div>
      <div style="font-size:0.85rem;color:var(--text-dim);margin-bottom:8px;">当前装备</div>
      ${slotHtml}
      <div style="font-size:0.85rem;color:var(--text-dim);margin:16px 0 8px 0;">背包（点击装备）</div>
      ${invHtml}
    `;

    panel.querySelectorAll('.unequip-btn').forEach(btn => {
      btn.onclick = () => {
        const slot = btn.dataset.slot;
        const eq = merc.equipment[slot];
        if(!eq) return;
        state.inventory = state.inventory || [];
        state.inventory.push(eq);
        merc.equipment[slot] = null;
        saveGame();
        refresh();
      };
    });

    panel.querySelectorAll('.inv-eq-btn').forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.dataset.idx);
        const eq = state.inventory[idx];
        if(!eq) return;
        const oldEq = merc.equipment[eq.type];
        state.inventory.splice(idx, 1);
        if(oldEq) state.inventory.push(oldEq);
        merc.equipment[eq.type] = eq;
        saveGame();
        refresh();
      };
    });

    panel.querySelector('#closeEquipBtn').onclick = () => {
      overlay.remove();
      if(onClose) onClose(); else renderTeam();
    };
  }

  overlay.appendChild(panel);
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay){ overlay.remove(); if(onClose) onClose(); else renderTeam(); } };
  refresh();
}
// ==================== 开除佣兵 ====================
function fireMercenary(merc){
  const refund = Math.floor(getMercenaryPrice(merc.job, merc.level) * 0.5);
  const equipList = [];
  if(merc.equipment){
    ['weapon','armor','trinket'].forEach(slot => {
      if(merc.equipment[slot]) equipList.push(merc.equipment[slot]);
    });
  }

  let msg = `确认开除「${merc.name}」吗？\n\n`;
  msg += `职业：${JOB_DATA[merc.job].name} · 等级：Lv.${merc.level}\n`;
  msg += `退还金币：${refund}（雇佣价 ${getMercenaryPrice(merc.job, merc.level)} 的 50%）\n`;
  if(equipList.length > 0){
    msg += `身上 ${equipList.length} 件装备将退回背包：\n`;
    equipList.forEach(eq => { msg += `  · ${eq.name}\n`; });
  }
  msg += `\n此操作不可逆！`;

  if(!confirm(msg)) return;

  // 退还金币
  state.gold += refund;
  // 装备退回背包
  state.inventory = state.inventory || [];
  equipList.forEach(eq => state.inventory.push(eq));
  // 从队伍移除
  const idx = state.team.findIndex(m => m.id === merc.id);
  if(idx >= 0) state.team.splice(idx, 1);

  saveGame();
  updateGoldDisplay();
  log(`🚫 开除了 ${merc.name}（+${refund} 金币${equipList.length > 0 ? `，退回 ${equipList.length} 件装备` : ''}）`, 'log-fail');
  renderTeam();
}
// ==================== 技能树弹窗 ====================
function openSkillTreeModal(merc){
  if(!merc.skillTree) merc.skillTree = initSkillTree();

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;justify-content:center;align-items:center;z-index:1000;';

  const panel = document.createElement('div');
  panel.style.cssText = 'background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;width:640px;max-width:94vw;max-height:88vh;overflow-y:auto;';

  const COST_PER_CLICK = 5;
  const PERCENT_PER_CLICK = 5;

  function refresh(){
    const nodes = SKILL_TREE[merc.job] || [];
    const jobName = JOB_DATA[merc.job].name;
    const gold = state.gold;

    const nodeHtml = nodes.map(node => {
      const ns = merc.skillTree[node.id] || { progress: 0 };
      const pct = ns.progress;
      const isFull = pct >= 100;
      const canAfford = gold >= COST_PER_CLICK;
      const barColor = isFull ? '#e3b341' : '#58a6ff';
      const effectText = node.desc;
      const effectiveValue = Object.keys(node.effect).map(k => {
        const v = node.effect[k] * (pct / 100);
        const label = { atkPercent:'ATK', hpPercent:'HP', defPercent:'DEF', spdPercent:'SPD', critBonus:'暴击', dodgeBonus:'闪避' }[k];
        return `${label} +${v.toFixed(1)}%`;
      }).join(' / ');

      return `
        <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border:1px solid ${isFull ? '#e3b341' : 'var(--border)'};border-radius:8px;margin-bottom:8px;">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;font-size:0.9rem;color:${isFull ? '#e3b341' : 'var(--text)'};margin-bottom:2px;">${node.name}</div>
            <div style="font-size:0.7rem;color:var(--text-dim);margin-bottom:6px;">满级效果：${effectText}</div>
            <div style="height:6px;background:#0d1117;border-radius:3px;overflow:hidden;border:1px solid var(--border);">
              <div style="height:100%;width:${pct}%;background:${barColor};transition:width 0.3s;"></div>
            </div>
            <div style="font-size:0.68rem;color:var(--text-dim);margin-top:4px;">${pct}% · 当前生效：${pct > 0 ? effectiveValue : '无'}</div>
          </div>
          <button class="skill-up-btn" data-node="${node.id}" ${(isFull || !canAfford) ? 'disabled' : ''}
            style="background:${isFull ? '#30363d' : (canAfford ? '#8f6d1f' : '#30363d')};border:1px solid ${isFull ? '#484f58' : (canAfford ? '#e3b341' : '#484f58')};border-radius:6px;padding:8px 14px;color:${isFull ? '#8b949e' : (canAfford ? '#fff' : '#8b949e')};cursor:${(isFull || !canAfford) ? 'not-allowed' : 'pointer'};font-size:0.8rem;font-weight:600;font-family:inherit;white-space:nowrap;">
            ${isFull ? '✓ 已满' : `升级<br><span style="font-size:0.7rem;">💰 ${COST_PER_CLICK} / +${PERCENT_PER_CLICK}%</span>`}
          </button>
        </div>
      `;
    }).join('');

    // 总加成统计
    const total = getSkillTreeBonus(merc);
    const summaryText = Object.keys(total).map(k => {
      if(total[k] === 0) return null;
      const label = { atkPercent:'ATK', hpPercent:'HP', defPercent:'DEF', spdPercent:'SPD', critBonus:'暴击', dodgeBonus:'闪避' }[k];
      return `${label} +${total[k].toFixed(1)}%`;
    }).filter(Boolean).join(' / ') || '尚未升级';

    panel.innerHTML = `
      <div style="font-size:1.1rem;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
        <span>🌳 ${merc.name} · 技能树 <span style="font-size:0.75rem;color:var(--text-dim);font-weight:400;">（${jobName}）</span></span>
        <span style="cursor:pointer;color:var(--text-dim);font-size:1.3rem;" id="closeSkillTreeBtn">✕</span>
      </div>
      <div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:12px;">
        💰 金币：<span style="color:var(--gold);font-family:var(--font-mono);">${gold}</span>
        &nbsp;·&nbsp; 每次升级 <span style="color:var(--gold);">${COST_PER_CLICK} 金币</span> 加 <span style="color:var(--accent);">${PERCENT_PER_CLICK}%</span> 进度
      </div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:14px;font-size:0.78rem;color:var(--text-dim);">
        🎯 当前技能树总加成：<span style="color:var(--success);">${summaryText}</span>
      </div>
      ${nodeHtml}
    `;

    panel.querySelectorAll('.skill-up-btn').forEach(btn => {
      btn.onclick = () => {
        const nodeId = btn.dataset.node;
        const ns = merc.skillTree[nodeId];
        if(!ns || ns.progress >= 100) return;
        if(state.gold < COST_PER_CLICK) return;
        state.gold -= COST_PER_CLICK;
        ns.progress = Math.min(100, ns.progress + PERCENT_PER_CLICK);
        saveGame();
        updateGoldDisplay();
        const node = (SKILL_TREE[merc.job] || []).find(n => n.id === nodeId);
        const nodeName = node ? node.name : nodeId;
        if(ns.progress >= 100){
          log(`🌳 ${merc.name} 的技能「${nodeName}」已满级！`, 'log-success');
        } else {
          log(`🌳 ${merc.name} 升级「${nodeName}」至 ${ns.progress}%（-${COST_PER_CLICK} 金币）`, 'log-gold');
        }
        refresh();
      };
    });

    panel.querySelector('#closeSkillTreeBtn').onclick = () => {
      overlay.remove();
      renderTeam();
    };
  }

  overlay.appendChild(panel);
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay){ overlay.remove(); renderTeam(); } };
  refresh();
}

function openSellModal(onClose){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;justify-content:center;align-items:center;z-index:1100;';

  function refresh(){
    const inv = state.inventory || [];
    if(inv.length === 0){
      panel.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <span style="font-size:1.1rem;font-weight:600;">💰 批量卖出</span>
          <span style="cursor:pointer;color:var(--text-dim);font-size:1.3rem;" id="closeSellBtn">✕</span>
        </div>
        <div style="color:var(--text-dim);text-align:center;padding:40px;font-size:0.9rem;">背包里没有装备</div>
      `;
      panel.querySelector('#closeSellBtn').onclick = () => { overlay.remove(); if(onClose) onClose(); };
      return;
    }

    const totalPrice = Array.from(selected).reduce((s, i) => {
      const eq = inv[i];
      return s + (eq ? getEquipSellPrice(eq) : 0);
    }, 0);

    const itemsHtml = inv.map((eq, idx) => {
      const isSel = selected.has(idx);
      const color = RARITY_COLORS[eq.rarity];
      const price = getEquipSellPrice(eq);
      return `
        <div class="sell-item" data-idx="${idx}" style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:${isSel ? '#2a1a1a' : 'var(--card)'};border:1px solid ${isSel ? '#f85149' : 'var(--border)'};border-radius:6px;margin-bottom:6px;cursor:pointer;">
          <div style="width:18px;height:18px;border:1px solid ${isSel ? '#f85149' : 'var(--border)'};border-radius:4px;display:flex;align-items:center;justify-content:center;background:${isSel ? '#f85149' : 'transparent'};color:#fff;font-size:0.7rem;font-weight:900;flex-shrink:0;">${isSel ? '✓' : ''}</div>
          <span style="font-size:0.85rem;color:${color};font-weight:600;width:90px;">${eq.name}</span>
          <span style="font-size:0.7rem;color:var(--text-dim);width:60px;">${RARITY_NAMES[eq.rarity] || ''}</span>
          <span style="font-size:0.75rem;color:var(--text-dim);flex:1;">${formatEquipStats(eq)}</span>
          <span style="font-size:0.78rem;color:var(--gold);font-family:var(--font-mono);">💰 ${price}</span>
        </div>
      `;
    }).join('');

    panel.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <span style="font-size:1.1rem;font-weight:600;">💰 批量卖出</span>
        <span style="cursor:pointer;color:var(--text-dim);font-size:1.3rem;" id="closeSellBtn">✕</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">
        <button class="sel-all-btn" data-rarity="all" style="background:var(--card);border:1px solid var(--accent);border-radius:4px;padding:4px 12px;color:var(--accent);cursor:pointer;font-size:0.75rem;font-family:inherit;">全选</button>
        <button class="sel-all-btn" data-rarity="0" style="background:var(--card);border:1px solid var(--border);border-radius:4px;padding:4px 12px;color:var(--text-dim);cursor:pointer;font-size:0.75rem;font-family:inherit;">全不选</button>
        <button class="sel-all-btn" data-rarity="1" style="background:var(--card);border:1px solid #8b949e;border-radius:4px;padding:4px 12px;color:#8b949e;cursor:pointer;font-size:0.75rem;font-family:inherit;">全选普通</button>
        <button class="sel-all-btn" data-rarity="2" style="background:var(--card);border:1px solid #58a6ff;border-radius:4px;padding:4px 12px;color:#58a6ff;cursor:pointer;font-size:0.75rem;font-family:inherit;">全选优秀</button>
        <button class="sel-all-btn" data-rarity="3" style="background:var(--card);border:1px solid #a371f7;border-radius:4px;padding:4px 12px;color:#a371f7;cursor:pointer;font-size:0.75rem;font-family:inherit;">全选稀有</button>
        <button class="sel-all-btn" data-rarity="4" style="background:var(--card);border:1px solid #e3b341;border-radius:4px;padding:4px 12px;color:#e3b341;cursor:pointer;font-size:0.75rem;font-family:inherit;">全选史诗</button>
        <button class="sel-all-btn" data-rarity="5" style="background:var(--card);border:1px solid #ff3366;border-radius:4px;padding:4px 12px;color:#ff3366;cursor:pointer;font-size:0.75rem;font-family:inherit;">全选传说</button>
        <button class="sel-all-btn" data-rarity="6" style="background:var(--card);border:1px solid #ff9933;border-radius:4px;padding:4px 12px;color:#ff9933;cursor:pointer;font-size:0.75rem;font-family:inherit;">全选神话</button>
        <button class="sel-all-btn" data-rarity="7" style="background:var(--card);border:1px solid #00e5ff;border-radius:4px;padding:4px 12px;color:#00e5ff;cursor:pointer;font-size:0.75rem;font-family:inherit;">全选秘传</button>
        <button class="sel-all-btn" data-rarity="8" style="background:var(--card);border:1px solid #ffffff;border-radius:4px;padding:4px 12px;color:#ffffff;cursor:pointer;font-size:0.75rem;font-family:inherit;">全选神器</button>
        <button class="sel-all-btn" data-rarity="9" style="background:var(--card);border:1px solid #8b1aff;border-radius:4px;padding:4px 12px;color:#8b1aff;cursor:pointer;font-size:0.75rem;font-family:inherit;">全选深渊</button>
      </div>
      <div style="flex:1;overflow-y:auto;margin-bottom:12px;max-height:50vh;">${itemsHtml}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border);">
        <div style="font-size:0.85rem;color:var(--text-dim);">
          已选 <strong style="color:#f85149;">${selected.size}</strong> 件 · 合计 <strong style="color:var(--gold);">💰 ${totalPrice}</strong>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn" id="cancelSellBtn" style="padding:8px 16px;">取消</button>
          <button class="btn" id="confirmSellBtn" ${selected.size === 0 ? 'disabled' : ''} style="padding:8px 16px;background:#7a2020;border-color:#a34b4b;color:#fff;">确认卖出</button>
        </div>
      </div>
    `;

    panel.querySelectorAll('.sell-item').forEach(el => {
      el.onclick = () => {
        const idx = parseInt(el.dataset.idx);
        if(selected.has(idx)) selected.delete(idx);
        else selected.add(idx);
        refresh();
      };
    });

    panel.querySelectorAll('.sel-all-btn').forEach(btn => {
      btn.onclick = () => {
        const r = btn.dataset.rarity;
        if(r === 'all'){
          selected.clear();
          state.inventory.forEach((_, i) => selected.add(i));
        } else if(r === '0'){
          selected.clear();
        } else {
          const target = parseInt(r);
          state.inventory.forEach((eq, i) => {
            if(eq.rarity === target) selected.add(i);
          });
        }
        refresh();
      };
    });

    panel.querySelector('#closeSellBtn').onclick = () => { overlay.remove(); if(onClose) onClose(); };
    panel.querySelector('#cancelSellBtn').onclick = () => { overlay.remove(); if(onClose) onClose(); };
    panel.querySelector('#confirmSellBtn').onclick = () => {
      if(selected.size === 0) return;
      const indices = Array.from(selected).sort((a, b) => b - a);
      const itemsToSell = indices.map(i => state.inventory[i]).filter(Boolean);
      const totalGold = itemsToSell.reduce((s, eq) => s + getEquipSellPrice(eq), 0);
      if(!confirm(`确认卖出 ${itemsToSell.length} 件装备？\n合计获得：${totalGold} 金币`)) return;
      indices.forEach(i => state.inventory.splice(i, 1));
      state.gold += totalGold;
      saveGame();
      updateGoldDisplay();
      log(`💸 卖出了 ${itemsToSell.length} 件装备（+${totalGold} 金币）`, 'log-gold');
      playSound('sell');
      overlay.remove();
      if(onClose) onClose();
    };
  }

  overlay.appendChild(panel);
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay){ overlay.remove(); if(onClose) onClose(); } };
  refresh();
}

          <span style="cursor:pointer;color:var(--text-dim);font-size:1.3rem;" id="closeFusionBtn">✕</span>

        <div style="color:var(--text-dim);text-align:center;padding:40px;font-size:0.9rem;">背包里至少需要 3 件装备</div>
      `;
      panel.querySelector('#closeFusionBtn').onclick = () => { overlay.remove(); if(onClose) onClose(); };
      return;
    }

    const selectedItems = Array.from(selected).map(i => inv[i]).filter(Boolean);
    const selRarity = selectedItems.length > 0 ? selectedItems[0].rarity : null;
    const allSame = selectedItems.length > 0 && selectedItems.every(e => e.rarity === selRarity);
    const canFuse = selected.size === 3 && allSame && selRarity < 9;

    let infoHtml = '';
    if(selected.size === 0){
      infoHtml = '<span style="color:var(--text-dim);">请选择 3 件装备</span>';
    } else if(!allSame){
      infoHtml = '<span style="color:#f85149;">⚠️ 只能选同稀有度的装备</span>';
    } else if(selected.size < 3){
      infoHtml = `已选 <strong style="color:var(--gold);">${selected.size}</strong> / 3 件 · 还需 ${3 - selected.size} 件`;
    } else {
      const cost = getFusionCost(selRarity);
      const canAfford = state.gold >= cost;
      const rn = RARITY_NAMES[selRarity];
      const nn = RARITY_NAMES[selRarity + 1] || '?';
      infoHtml = `3 件 <span style="color:${RARITY_COLORS[selRarity]};">${rn}</span> → 1 件 <span style="color:${RARITY_COLORS[selRarity + 1]};">${nn}</span> · 消耗 <strong style="color:${canAfford ? 'var(--gold)' : '#f85149'};">💰 ${cost}</strong>`;
    }

    const itemsHtml = inv.map((eq, idx) => {
      const isSel = selected.has(idx);
      const color = RARITY_COLORS[eq.rarity];
      const lockout = isSel ? false : (selRarity !== null && eq.rarity !== selRarity);
      return `
        <div class="fusion-item" data-idx="${idx}" style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:${isSel ? '#2a2318' : 'var(--card)'};border:1px solid ${isSel ? '#e3b341' : 'var(--border)'};border-radius:6px;margin-bottom:6px;cursor:${lockout ? 'not-allowed' : 'pointer'};opacity:${lockout ? 0.3 : 1};">
          <div style="width:18px;height:18px;border:1px solid ${isSel ? '#e3b341' : 'var(--border)'};border-radius:4px;display:flex;align-items:center;justify-content:center;background:${isSel ? '#e3b341' : 'transparent'};color:#0d1117;font-size:0.7rem;font-weight:900;flex-shrink:0;">${isSel ? '✓' : ''}</div>
          <span style="font-size:0.85rem;color:${color};font-weight:600;width:100px;">${eq.name}</span>
          <span style="font-size:0.7rem;color:var(--text-dim);width:56px;">${RARITY_NAMES[eq.rarity] || ''}</span>
          <span style="font-size:0.75rem;color:var(--text-dim);flex:1;">${formatEquipStats(eq)}</span>
        </div>
      `;
    }).join('');

    panel.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <span style="font-size:1.1rem;font-weight:600;">🔧 装备合成</span>
        <span style="cursor:pointer;color:var(--text-dim);font-size:1.3rem;" id="closeFusionBtn">✕</span>
      </div>
      <div style="color:var(--text-dim);font-size:0.78rem;margin-bottom:8px;">选择 3 件同稀有度装备 → 合成 1 件更高档（产出随机）</div>
      <div style="flex:1;overflow-y:auto;margin-bottom:12px;max-height:50vh;">${itemsHtml}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border);gap:12px;flex-wrap:wrap;">
        <div style="font-size:0.85rem;">${infoHtml}</div>
        <div style="display:flex;gap:8px;">
          <button class="btn" id="cancelFusionBtn" style="padding:8px 16px;">取消</button>
          <button class="btn" id="confirmFusionBtn" ${canFuse ? '' : 'disabled'} style="padding:8px 16px;background:#8f6d1f;border-color:#e3b341;color:#fff;">🔧 合成</button>
        </div>
      </div>
    `;

    panel.querySelectorAll('.fusion-item').forEach(el => {
      el.onclick = () => {
        const idx = parseInt(el.dataset.idx);
        const eq = inv[idx];
        if(!eq) return;
        if(selected.has(idx)){
          selected.delete(idx);
        } else {
          if(selected.size >= 3) return;
          if(selRarity !== null && eq.rarity !== selRarity) return;
          selected.add(idx);
        }
        playSound('click');
        refresh();
      };
    });

    panel.querySelector('#closeFusionBtn').onclick = () => { overlay.remove(); if(onClose) onClose(); };
    panel.querySelector('#cancelFusionBtn').onclick = () => { overlay.remove(); if(onClose) onClose(); };
    panel.querySelector('#confirmFusionBtn').onclick = () => {
      if(selected.size !== 3) return;
      const cost = getFusionCost(selRarity);
      const rn = RARITY_NAMES[selRarity];
      const nn = RARITY_NAMES[selRarity + 1];
      if(!confirm(`合成 3 件${rn} → 1 件${nn}？\n消耗：${cost} 金币`)) return;
      const indices = Array.from(selected);
      if(tryFusionByIndices(indices)){
        playSound('buy');
        overlay.remove();
        if(onClose) onClose();
      }
    };
  }

  overlay.appendChild(panel);
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay){ overlay.remove(); if(onClose) onClose(); } };
  refresh();
}

// ==================== 装备商店 ====================
function openShopModal(){
  // 首次进入或库存为空 → 生成
  if(!state.shopStock || state.shopStock.length === 0){
    state.shopStock = generateShopStock(state.dungeonFloor);
    saveGame();
  }

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;justify-content:center;align-items:center;z-index:1000;';

  const panel = document.createElement('div');
  panel.style.cssText = 'background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;width:760px;max-width:94vw;max-height:88vh;overflow-y:auto;';

  function refresh(){
    const floor = state.dungeonFloor;
    const gold = state.gold;
    const refreshCost = state.shopRefreshCost;

    // 购买列表
    const buyHtml = state.shopStock.map((eq, idx) => {
      const price = getEquipBuyPrice(eq);
      const canAfford = gold >= price;
      const color = RARITY_COLORS[eq.rarity];
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;">
          <span style="font-size:0.85rem;color:${color};font-weight:600;width:90px;">${eq.name}</span>
          <span style="font-size:0.75rem;color:var(--text-dim);flex:1;">${formatEquipStats(eq)}</span>
          <button class="buy-btn" data-idx="${idx}" ${canAfford?'':'disabled'} style="background:${canAfford?'#238636':'#30363d'};border:1px solid ${canAfford?'#2ea043':'#484f58'};border-radius:4px;padding:5px 12px;color:${canAfford?'#fff':'#8b949e'};cursor:${canAfford?'pointer':'not-allowed'};font-size:0.78rem;font-family:inherit;">💰 ${price}</button>
        </div>
      `;
    }).join('') || '<div style="color:var(--text-dim);text-align:center;padding:16px;">本层没有可购买的装备</div>';

    // 卖出列表（只展示，不带单件卖出按钮）
    const inv = state.inventory || [];
    const sellHtml = inv.length === 0
      ? '<div style="color:var(--text-dim);font-size:0.8rem;text-align:center;padding:16px;">背包里没有装备</div>'
      : inv.map((eq, idx) => {
          const color = RARITY_COLORS[eq.rarity];
          return `
            <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;">
              <span style="font-size:0.85rem;color:${color};font-weight:600;width:90px;">${eq.name}</span>
              <span style="font-size:0.75rem;color:var(--text-dim);flex:1;">${formatEquipStats(eq)}</span>
            </div>
          `;
        }).join('');
    const refreshBtnText = refreshCost === 0 ? '🔄 刷新商品（免费）' : `🔄 刷新商品（💰 ${refreshCost}）`;
    const canRefresh = gold >= refreshCost;

    panel.innerHTML = `
      <div style="font-size:1.1rem;font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;">
        <span>🛒 装备商店 · 当前第 ${floor} 层</span>
        <span style="cursor:pointer;color:var(--text-dim);font-size:1.3rem;" id="closeShopBtn">✕</span>
      </div>
      <div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:12px;">💰 当前金币：<span style="color:var(--gold);font-family:var(--font-mono);">${gold}</span> · 卖价永远是买价的 30%</div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-size:0.9rem;color:var(--success);font-weight:600;">🛍️ 购买（6 件随机商品）</span>
        <button id="refreshShopBtn" ${canRefresh?'':'disabled'} style="background:${canRefresh?'#1f6f8b':'#30363d'};border:1px solid ${canRefresh?'#2a9fc7':'#484f58'};border-radius:4px;padding:4px 12px;color:${canRefresh?'#fff':'#8b949e'};cursor:${canRefresh?'pointer':'not-allowed'};font-size:0.75rem;font-family:inherit;">${refreshBtnText}</button>
      </div>
      ${buyHtml}

      <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 6px 0;">
        <span style="font-size:0.9rem;color:var(--gold);font-weight:600;">🔧 装备合成</span>
        ${inv.length >= 3 ? '<button id="openFusionModalBtn" style="background:#8f6d1f;border:1px solid #e3b341;border-radius:4px;padding:4px 14px;color:#fff;cursor:pointer;font-size:0.78rem;font-family:inherit;">🔧 打开合成</button>' : ''}
      </div>
      <div style="font-size:0.72rem;color:var(--text-dim);margin-bottom:8px;">选择 3 件同稀有度装备 → 合成 1 件更高档</div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px 0;">
        <span style="font-size:0.9rem;color:var(--danger);font-weight:600;">💸 背包（可卖出）</span>
        ${inv.length > 0 ? '<button id="openSellModalBtn" style="background:#7a2020;border:1px solid #a34b4b;border-radius:4px;padding:4px 14px;color:#fff;cursor:pointer;font-size:0.78rem;font-family:inherit;">💰 批量卖出</button>' : ''}
      </div>
      ${sellHtml}
    `;

    panel.querySelectorAll('.buy-btn').forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.dataset.idx);
        const eq = state.shopStock[idx];
        if(!eq) return;
        const price = getEquipBuyPrice(eq);
        if(state.gold < price) return;
        state.gold -= price;
        state.inventory = state.inventory || [];
        state.inventory.push({ ...eq });
        state.shopStock.splice(idx, 1);
        saveGame();
        updateGoldDisplay();
        log(`🛒 购买了 ${eq.name}（-${price} 金币）`, 'log-gold');
        playSound('buy');
        refresh();
      };
    });

    const openSellBtn = panel.querySelector('#openSellModalBtn');
    if(openSellBtn){
      openSellBtn.onclick = () => {
        openSellModal(() => { refresh(); });
      };
    }

    const openFusionBtn = panel.querySelector('#openFusionModalBtn');
    if(openFusionBtn){
      openFusionBtn.onclick = () => {
        openFusionModal(() => { refresh(); });
      };
    }
    const refreshBtn = panel.querySelector('#refreshShopBtn');
    if(refreshBtn){
      refreshBtn.onclick = () => {
        const cost = state.shopRefreshCost;
        if(state.gold < cost) return;
        state.gold -= cost;
        state.shopRefreshCost = Math.min(100, state.shopRefreshCost + 20);
        state.shopStock = generateShopStock(state.dungeonFloor);
        saveGame();
        updateGoldDisplay();
        if(cost === 0){
          log(`🔄 商店首次刷新免费！（下次费用 ${state.shopRefreshCost}）`, 'log-gold');
        } else {
          log(`🔄 花费 ${cost} 金币刷新商店（下次费用 ${state.shopRefreshCost}）`, 'log-gold');
        }
        refresh();
      };
    }

    panel.querySelector('#closeShopBtn').onclick = () => {
      overlay.remove();
    };
  }

  overlay.appendChild(panel);
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  refresh();
}

document.getElementById('btnExportSave').onclick = ()=>{
  try{
    const save = localStorage.getItem(SAVE_KEY);
    if(!save){ log('没有存档可以导出。', 'log-fail'); return; }
    const blob = new Blob([save], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const date = new Date();
    const stamp = `${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}_${String(date.getHours()).padStart(2,'0')}${String(date.getMinutes()).padStart(2,'0')}`;
    a.download = `dungeon_save_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    log(`📤 存档已导出：${a.download}`, 'log-success');
  }catch(e){ log('导出失败：' + e.message, 'log-fail'); }
};

  input.click();
};

// ==================== 音效系统 ====================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio(){
  if(!audioCtx){
    try{ audioCtx = new AudioCtx(); }catch(e){ console.error('AudioContext 创建失败', e); }
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound(type){
  if(!state || state.soundEnabled === false) return;
  if(!audioCtx) initAudio();
  if(!audioCtx) return;
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const beep = (freq, dur, waveType, vol, delay, freqEnd) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = waveType || 'sine';
    osc.frequency.setValueAtTime(freq, now + (delay || 0));
    if(freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, now + (delay || 0) + dur);
    gain.gain.setValueAtTime(0, now + (delay || 0));
    gain.gain.linearRampToValueAtTime(vol || 0.15, now + (delay || 0) + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + (delay || 0) + dur);
    osc.start(now + (delay || 0)); osc.stop(now + (delay || 0) + dur + 0.05);
  };
  const chord = (freqs, dur, waveType, vol, stagger) => {
    freqs.forEach((f, i) => beep(f, dur, waveType, vol, i * (stagger || 0.05)));
  };
  switch(type){
    case 'click':  beep(1200, 0.03, 'sine', 0.06); break;
    case 'recruit': chord([523, 659, 784, 1047], 0.15, 'triangle', 0.12, 0.06); break;
    case 'hit':    beep(280, 0.08, 'sawtooth', 0.12, 0, 160); break;
    case 'crit':   chord([900, 1300, 1800], 0.08, 'square', 0.15, 0.04); break;
    case 'dodge':  beep(1400, 0.08, 'sine', 0.10, 0, 2200); break;
    case 'heal':   chord([500, 700, 900], 0.15, 'sine', 0.12, 0.06); break;
    case 'die':    beep(420, 0.35, 'sawtooth', 0.15, 0, 80); break;
    case 'win':    chord([523, 659, 784, 1047, 1319], 0.2, 'triangle', 0.15, 0.1); break;
    case 'lose':   chord([400, 320, 240, 180], 0.25, 'sawtooth', 0.14, 0.15); break;
    case 'levelup':chord([600, 800, 1000, 1200], 0.12, 'triangle', 0.14, 0.07); break;
    case 'drop':   chord([900, 1200, 1500], 0.1, 'triangle', 0.12, 0.05); break;
    case 'gold':   beep(2000, 0.05, 'sine', 0.10); beep(2500, 0.06, 'sine', 0.09, 0.05); break;
    case 'buy':    chord([700, 900, 1100], 0.1, 'triangle', 0.12, 0.05); break;
    case 'sell':   beep(900, 0.05, 'triangle', 0.09); beep(600, 0.06, 'triangle', 0.09, 0.05); break;
    case 'error':  beep(220, 0.15, 'square', 0.12); beep(160, 0.15, 'square', 0.12, 0.15); break;
    case 'ult':    chord([120, 90, 70], 0.4, 'sawtooth', 0.2, 0.1); break;
    case 'charge': beep(300, 0.18, 'square', 0.10, 0, 600); break;
    case 'open':   beep(700, 0.06, 'triangle', 0.10); beep(1000, 0.06, 'triangle', 0.10, 0.05); break;
  }
}

document.getElementById('btnSound').onclick = () => {
  initAudio();
  state.soundEnabled = !state.soundEnabled;
  const btn = document.getElementById('btnSound');
  btn.textContent = state.soundEnabled ? '🔊 音效：开' : '🔇 音效：关';
  btn.style.background = state.soundEnabled ? '#4d3a1f' : '#30363d';
  btn.style.borderColor = state.soundEnabled ? '#8a6a3a' : '#484f58';
  saveGame();
  if(state.soundEnabled) playSound('click');
};

// ==================== 全局点击音效 ====================
document.addEventListener('click', (e) => {
  // 只对可点击元素发声
  if(state && state.soundEnabled && e.target.closest('button, .merc-card, .target-chip, .tactic-btn, .battle-card, .algo-select-chip, .difficulty-btn, .fusion-chip, .inv-eq-btn')){
    playSound('click');
  }
}, true);

// ==================== 启动 ====================
refreshMainMenu();
updateGoldDisplay();
// 恢复音效按钮状态
if(state.soundEnabled === false){
  const btn = document.getElementById('btnSound');
  if(btn){
    btn.textContent = '🔇 音效：关';
    btn.style.background = '#30363d';
    btn.style.borderColor = '#484f58';
  }
}
log('欢迎来到地牢佣兵团！', 'log-gold');
log('开发者：ZIYIZ Studio');
log('从第 1 层开始，一路打到第 50 层 BOSS「地牢守卫者」。祝你好运，团长。');
</script>
